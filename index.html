<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:"Outfit","Noto Sans SC","Source Han Sans SC","Microsoft YaHei UI",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;background:#6dbbf1;color:#263a50}
.screen{position:relative;width:100%;height:100%;min-height:320px;overflow:hidden}
.background,.background video{position:absolute;inset:0;width:100%;height:100%}
.background{background-position:center;background-size:cover}

.logo{position:absolute;top:3.4%;left:2.2%;width:clamp(180px,29vw,330px);height:auto;z-index:2;filter:drop-shadow(0 1px 2px rgba(42,105,153,.15))}
.version{position:absolute;right:2%;bottom:3.5%;z-index:2;font-size:clamp(10px,1.2vw,14px);color:#1c3548;text-shadow:0 1px 2px #fff,0 0 3px #fff}
.top-controls{position:absolute;top:3.4%;right:2%;z-index:3;display:flex;gap:10px}
.top-controls button{position:relative;isolation:isolate;display:grid;place-items:center;width:58px;height:46px;padding:0;border:0;background:none;color:#315570;cursor:pointer;transition:transform .14s ease,color .14s ease,filter .14s ease}
.top-controls button::before{position:absolute;inset:0;z-index:-1;content:"";clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(224,239,247,.94));box-shadow:inset 0 0 0 2px rgba(85,156,195,.55)}
.top-controls button::after{position:absolute;inset:3px;z-index:-1;content:"";clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);background:#2ab6e5;opacity:0;transform:scale(.86);transition:opacity .18s ease,transform .18s ease}
.top-controls button:hover,.top-controls button:focus-visible{color:#1785ad;filter:drop-shadow(0 2px 5px rgba(25,111,154,.35));transform:translateY(-2px);outline:none}
.top-controls button:active{color:#fff;transform:translateY(1px) scale(.93)}
.top-controls button:active::after,.top-controls button.ba-clicked::after{opacity:1;transform:scale(1)}
.top-controls button.ba-clicked{color:#fff;animation:ba-button-flash .28s ease-out}
.top-controls svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sound-toggle[aria-pressed="true"] .sound-wave,#sound-toggle[aria-pressed="false"] .sound-slash{display:none}
@keyframes ba-button-flash{0%{transform:scale(.88)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.start-menu{position:absolute;left:50%;bottom:clamp(50px,8vh,86px);transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;gap:clamp(7px,1.4vh,15px);width:min(72vw,500px);min-width:220px}
.start-menu button{width:100%;height:clamp(38px,6vh,54px);padding:0;border:0;background:linear-gradient(90deg,transparent 0%,rgba(245,250,255,.16) 16%,rgba(245,250,255,.52) 38%,rgba(245,250,255,.52) 62%,rgba(245,250,255,.16) 84%,transparent 100%);color:#8ba6cb;cursor:pointer;font:700 clamp(34px,5.4vh,49px)/1 Arial,sans-serif;letter-spacing:.045em;white-space:nowrap;transition:color .2s}
.start-menu button:hover,.start-menu button:focus-visible{background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.22) 16%,rgba(255,255,255,.72) 38%,rgba(255,255,255,.72) 62%,rgba(255,255,255,.22) 84%,transparent 100%);color:#658ab7;outline:none}
.left-controls{position:absolute;left:2.1%;bottom:4%;z-index:3;display:flex;align-items:flex-start;flex-direction:column;gap:6px}
.left-controls button{border:0;border-radius:3px;background:rgba(255,255,255,.93);color:#283e52;box-shadow:0 2px 5px rgba(34,77,111,.24);transform:skew(-9deg);font:italic 700 clamp(14px,1.7vw,19px)/1 Arial,"Yu Gothic",sans-serif;cursor:pointer;padding:12px 23px;min-width:90px;transition:filter .2s,transform .2s}
.left-controls button span{display:block;transform:skew(9deg)}
.left-controls button:hover,.left-controls button:focus-visible{filter:brightness(1.08);transform:skew(-9deg) translateY(-2px)}
.credits{position:absolute;bottom:1.5%;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;width:max-content;max-width:96%;color:#1d303d;font-size:clamp(9px,1.15vw,13px);text-align:center;text-shadow:0 1px 2px #fff,0 0 4px #fff}
.credits a{color:inherit;text-decoration:none}
.credits a:hover{text-decoration:underline}
.credits .license{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.credits .license img{height:clamp(14px,1.8vw,20px);width:auto;vertical-align:middle}
.notice-overlay{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:4vh 4vw;background:rgba(4,20,38,.74);font-family:"LINE Seed Sans SC","Noto Sans CJK SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif}
.notice-overlay[hidden]{display:none}
.notice-panel{position:relative;display:flex;flex-direction:column;width:min(90vw,1120px);height:min(84vh,690px);min-height:310px;overflow:hidden;background:#f8fbfd;box-shadow:0 16px 42px rgba(0,18,36,.4);outline:0;clip-path:polygon(0 0,calc(100% - 17px) 0,100% 17px,100% 100%,17px 100%,0 calc(100% - 17px))}
.notice-header{display:flex;align-items:center;justify-content:space-between;flex:0 0 82px;padding:12px 26px 8px 32px;background:linear-gradient(105deg,#fff 60%,#e3f5fd)}
.notice-brand{width:min(47vw,330px);max-height:56px;object-fit:contain;object-position:left center}
.notice-close{display:grid;place-items:center;width:52px;height:52px;border:0;background:transparent;cursor:pointer}
.notice-close img{width:40px;height:40px}
.notice-tabs{display:flex;flex:0 0 53px;align-items:stretch;padding:0 22px;gap:3px;border-bottom:3px solid #1788b9;background:#f5f9fc}
.notice-tab{position:relative;display:flex;justify-content:center;align-items:center;gap:7px;flex:1;border:0;border-right:1px solid #c8dce8;background:#e8f2f8;color:#5e829a;font-size:18px;font-weight:700;line-height:1.2;font-family:inherit;letter-spacing:.025em;cursor:pointer;transform:skew(-7deg)}
.notice-tab:first-child{border-left:1px solid #c8dce8}
.notice-tab>*{transform:skew(7deg)}
.notice-tab.active{background:#19a3d3;color:#fff}
.notice-tab img{width:28px;height:29px;object-fit:contain}
.notice-body{flex:1;min-height:0;overflow:auto;margin:18px 22px 22px;border:1px solid #dae5eb;background:#fff}
.notice-empty{display:grid;place-items:center;min-height:100%;padding:24px;color:#7a91a4;font-size:18px;font-weight:500}
.notice-update{padding:29px 38px;color:#394c60;font-size:17px;font-weight:500;line-height:1.8;letter-spacing:.025em}
.notice-update h2{margin:0 0 19px;padding:0 0 8px;border-bottom:1px solid #e5ecf0;color:#278fbd;font-size:22px;font-weight:700;letter-spacing:.045em}
.notice-update ul{margin:0;padding:0;list-style:none}
.notice-update li{padding:3px 0}
.notice-footer{display:flex;justify-content:flex-end;align-items:center;flex:0 0 48px;padding:0 24px 15px;color:#537087;font-size:14px;font-weight:600}
.notice-suppress{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.notice-suppress input{width:17px;height:17px;margin:0;accent-color:#19a3d3;cursor:pointer}
@media(max-width:640px){.notice-panel{width:96vw;height:min(78vh,550px)}.notice-header{flex-basis:65px;padding:8px 14px}.notice-brand{width:min(59vw,240px)}.notice-close{width:42px;height:42px}.notice-close img{width:34px;height:34px}.notice-tabs{padding:0 10px;flex-basis:46px}.notice-tab{font-size:14px}.notice-body{margin:10px}.notice-empty{font-size:15px}}
.loading{position:fixed;inset:0;z-index:10;background:#fff;transition:opacity .45s ease,visibility .45s ease}
.loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-ready{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}
.loading-ready[hidden]{display:none}
.loading-ready:focus-visible{outline:3px solid #19a3d3;outline-offset:-6px}
.loading-message{position:absolute;left:2.8%;bottom:2%;z-index:1;display:flex;align-items:center;gap:8px;max-width:90%;color:#344354;font:500 clamp(12px,1.5vw,16px)/1.4 "Yu Gothic","Microsoft YaHei UI",sans-serif;text-shadow:0 1px 2px rgba(255,255,255,.75)}
.loading-spinner{flex:none;width:18px;height:18px;border:3px solid rgba(26,170,220,.28);border-top-color:#10a8e1;border-radius:50%;animation:loading-spin .8s linear infinite}
.loading.retry .loading-spinner{animation-play-state:paused}
@keyframes loading-spin{to{transform:rotate(360deg)}}
.loading-arona{position:absolute;left:2.2%;bottom:3.5%;width:clamp(70px,9vw,120px);height:auto;animation:arona-bob 1.4s ease-in-out infinite}
.loading-now{position:absolute;right:2.2%;bottom:3.5%;width:clamp(190px,30vw,360px);height:auto}
.loading.retry .loading-spinner{animation-play-state:paused}
.loading-error{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;gap:16px;color:#20608a;font:700 15px/1.4 Arial,"Yu Gothic",sans-serif;white-space:nowrap}
.loading-error[hidden]{display:none}
.loading-retry{border:1px solid #3b9ac9;background:#fff;border-radius:4px;color:#216b97;padding:8px 22px;font:700 14px Arial,"Yu Gothic",sans-serif;cursor:pointer}
@media(max-width:640px){.logo{width:39vw;min-width:130px}.start-menu{width:min(75vw,400px)}.start-menu button{font-size:clamp(34px,5.4vh,49px)}.left-controls{left:3%;bottom:7%;gap:4px}.left-controls button{font-size:13px;padding:9px 16px;min-width:72px}.credits{bottom:2%;font-size:9px;gap:3px 8px}}
.story{position:fixed;inset:0;z-index:5;overflow:hidden;background:#567d9a;color:#fff;font-family:"LINE Seed Sans SC","Noto Sans CJK SC","Microsoft YaHei UI","Yu Gothic",sans-serif;opacity:0;transition:opacity .48s ease}

.story[hidden]{display:none}
.story.is-visible{opacity:1}
.story-backdrop{position:absolute;inset:0;background:center / cover no-repeat}

.story-ui{position:absolute;z-index:4;inset:0;transition:opacity .25s ease;pointer-events:none}

.story.ui-hidden .story-ui{opacity:0;pointer-events:none}
.story.ui-hidden .story-ui>*{pointer-events:none}
.story-top{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:flex-start;justify-content:space-between;padding:clamp(12px,2.3vh,20px) clamp(12px,2.1vw,27px)}
.story-chapter{margin-top:clamp(100px,19vh,150px);margin-left:calc(-1 * clamp(12px,2.1vw,27px));padding:7px 17px 7px 29px;background:rgba(20,39,55,.68);font-size:clamp(14px,1.7vw,20px);font-weight:700;letter-spacing:.04em;text-shadow:0 1px 3px #405266}
.story-tools{display:flex;align-items:center;gap:7px}
.story-tool{display:flex;align-items:center;justify-content:center;height:clamp(34px,4.3vh,46px);padding:0 clamp(12px,1.5vw,23px);border:0;background:rgba(255,255,255,.96);color:#2c4159;clip-path:polygon(7px 0,100% 0,calc(100% - 5px) 100%,0 100%);transform:skew(-8deg);font:italic 800 clamp(15px,2vw,24px)/1 Arial,"Yu Gothic",sans-serif;white-space:nowrap;cursor:pointer;transition:background .15s,filter .15s}
.story-tool:hover,.story-tool:focus-visible,.story-tool[aria-pressed="true"]{background:#91e1f7;color:#1b4b6e;filter:drop-shadow(0 2px 5px #355679);outline:none}

.story-dialogue{position:absolute;left:0;right:0;bottom:0;height:clamp(140px,31vh,260px);padding:clamp(29px,4.7vh,47px) clamp(34px,9.4vw,140px) 25px;background:linear-gradient(180deg,rgba(15,30,47,.05),rgba(15,29,47,.67) 21%,rgba(10,25,42,.89) 90%,rgba(9,25,43,.91));cursor:pointer}

.story-next{position:absolute;right:7%;bottom:15%;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font:700 13px/1 Arial,sans-serif}

.story-next[hidden]{display:none}

.story-advance{position:absolute;inset:12% 0 31%;z-index:2;width:100%;border:0;background:transparent;cursor:pointer}

.story-log{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;gap:20px;padding:clamp(24px,5vh,54px) clamp(24px,8vw,145px);background:rgba(8,24,42,.96);backdrop-filter:blur(12px)}

.story-log-entry strong{display:block;margin-bottom:8px;color:#53d0f1;font-size:17px}
.story-log-entry p{margin:0;font-size:18px;line-height:1.65}
.story-menu{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(5,21,37,.77);backdrop-filter:blur(9px)}
.story-menu[hidden]{display:none}
.story-menu-panel{width:min(470px,88vw);padding:35px;background:#f8fbfe;color:#26455f;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));box-shadow:0 12px 35px #0b2136}
.story-menu-panel h2{margin:0 0 23px;border-bottom:2px solid #2bbde8;padding-bottom:13px;font-size:28px}
.story-menu-panel button{display:block;width:100%;margin:10px 0;padding:15px;border:1px solid #c9e0ec;background:#edf7fc;color:#29536d;font:700 17px/1.2 "LINE Seed Sans SC","Microsoft YaHei UI",sans-serif;cursor:pointer}
.story-menu-panel button:hover,.story-menu-panel button:focus-visible{background:#29b4df;color:#fff;outline:none}

aHei UI",sans-serif}.api-settings[hidden]{display:none}.api-settings-panel{width:min(690px,93vw);max-height:91vh;overflow:auto;padding:22px 30px;background:#f8fbfe;color:#25445b;box-shadow:0 16px 48px #091b30}.api-settings-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #34b8dd;margin-bottom:14px}.api-settings-head h2{margin:0 0 12px}.api-settings-panel button{border:1px solid #b1d7e6;background:#eaf7fc;color:#245e78;padding:8px 13px;cursor:pointer}.api-settings-panel button:hover,.api-settings-panel button:focus-visible{background:#44b8dc;color:#fff}.api-settings-panel label{display:flex;flex-direction:column;gap:5px;margin:10px 0;font-weight:700}.api-settings-panel input:not([type=checkbox]),.api-settings-panel select{width:100%;padding:8px;border:1px solid #b9d5e2;background:#fff;color:#25445b;font:16px Arial,"Microsoft YaHei UI",sans-serif}.api-settings-panel .api-check{display:inline-flex;flex-direction:row;align-items:center;gap:6px;margin-right:13px}.api-settings-panel .api-check input{width:auto}.api-settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}.api-settings-status{min-height:24px;color:#1c708f;word-break:break-word}
